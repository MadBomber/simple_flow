name: Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gemspec floor is Ruby >= 3.2, but the test toolchain pulls in
        # async -> io-event (~> 1.11), and io-event 1.15+ requires Ruby >= 3.3,
        # so the suite cannot be installed/run on 3.2 with the current lockfile.
        # Tracked separately (bump the floor or pin io-event < 1.15).
        ruby-version: ["3.3", "3.4", "4.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
